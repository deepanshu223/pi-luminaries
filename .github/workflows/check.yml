name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pi: '0.84.4'
          - os: windows-latest
            pi: '1.1.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
        timeout-minutes: 3
      - run: npm run pack:check
        timeout-minutes: 3
      - name: Install compatibility host
        run: npm install --prefix .pi/test-host --no-audit --no-fund --package-lock=false @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - name: Test Pi ${{ matrix.pi }}
        run: npm run test:native
        timeout-minutes: 3
        env:
          LUMINARIES_TEST_PI: ${{ github.workspace }}/.pi/test-host/node_modules/@earendil-works/pi-coding-agent/dist/cli.js
